[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "team-km"
version = "0.3.0"
description = "Local RAG knowledge base tooling for TeamKM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
ki = "ki.cli:main"

[project.optional-dependencies]
mcp = [
  "mcp>=1.12,<2",
]
dev = [
  "pytest>=7.4",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-include-markdown-plugin>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ki*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
