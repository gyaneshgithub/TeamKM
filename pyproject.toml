[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-intelligence"
version = "0.1.0"
description = "Local RAG knowledge base tooling for knowledgeIntelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
ki = "ki.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ki*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
